<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for Animations and Theme */
        body {
            background-color: #111827; /* Dark gray 900 */
            color: #f3f4f6; /* Gray 100 */
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1f2937;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Avatar SVG container styling */
        .avatar-svg .eyes, .avatar-svg .mouth {
            transform-origin: center;
        }
        .avatar-svg .eyes {
            transform-origin: 50px 40px;
        }
        .avatar-svg .mouth {
            transform-origin: 50px 65px;
        }

        /* Thinking animation (blinking) */
        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }
        .thinking .eyes {
            animation: blink 1.5s infinite;
        }

        /* Speaking animation (mouth moving) */
        @keyframes talk {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.3); }
        }
        .speaking .mouth {
            animation: talk 0.3s infinite;
        }

        /* Transition for smooth appearance changes */
        .avatar-svg * {
            transition: all 0.3s ease-in-out;
        }

        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-screen flex flex-col relative overflow-hidden">

    <!-- Header -->
    <header class="flex justify-between items-center p-4 bg-gray-800 shadow-md z-10">
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-mint to-blue-400">
            <span id="current-thread-name">会話スレッド</span>
        </h1>
        <button id="settings-btn" class="text-gray-300 hover:text-white transition transform hover:rotate-90 duration-300 p-2">
            <i class="fas fa-cog text-2xl"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Avatar Section (Pinned top on mobile, Left on desktop) -->
        <section class="flex-shrink-0 flex flex-col items-center justify-center p-6 bg-gray-900 border-b md:border-b-0 md:border-r border-gray-800 w-full md:w-1/3 min-h-[250px] md:min-h-0 z-10 transition-all duration-300" id="avatar-section">
            <div id="avatar-container" class="transition-all duration-300 flex items-center justify-center">
                <!-- SVG injected via JS -->
            </div>
            <!-- Status Text -->
            <div id="ai-status" class="mt-4 text-sm text-gray-400 h-5 font-medium tracking-wider animate-pulse"></div>
        </section>

        <!-- Chat History Section -->
        <section class="flex-1 flex flex-col bg-gray-900 relative">
            <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
                <!-- Messages injected here -->
                <div class="text-center text-gray-500 text-sm italic mt-10">
                    メッセージを入力して会話を始めましょう
                </div>
            </div>

            <!-- Input Area -->
            <div class="absolute bottom-0 w-full bg-gradient-to-t from-gray-900 via-gray-900 to-transparent pt-10 pb-4 px-4">
                <div class="max-w-3xl mx-auto flex items-end bg-gray-800 rounded-2xl border border-gray-700 shadow-2xl p-2 gap-2 transition-all focus-within:border-gray-500 focus-within:ring-1 focus-within:ring-gray-500">
                    <button id="mic-btn" class="p-3 rounded-full text-gray-400 hover:text-white hover:bg-gray-700 transition" title="音声入力">
                        <i class="fas fa-microphone"></i>
                    </button>
                    <textarea id="chat-input" rows="1" class="w-full bg-transparent text-white resize-none outline-none py-3 px-2 max-h-32" placeholder="メッセージ... (Enter2回で送信)"></textarea>
                    <button id="send-btn" class="p-3 rounded-full bg-blue-600 text-white hover:bg-blue-500 transition disabled:opacity-50" title="送信">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- Settings Overlay -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-gray-800 rounded-2xl border border-gray-700 shadow-2xl w-11/12 max-w-lg p-6 transform scale-95 transition-transform duration-300 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">設定</h2>
                <button id="close-settings-btn" class="text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>

            <div class="space-y-6">
                <!-- Thread Management -->
                <div class="border-b border-gray-700 pb-4">
                    <h3 class="text-sm font-semibold text-gray-400 uppercase mb-3">スレッド管理</h3>
                    <button id="new-thread-btn" class="w-full py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-white font-medium transition flex items-center justify-center gap-2">
                        <i class="fas fa-plus"></i> 新しいスレッドを作成
                    </button>
                    <p class="text-xs text-gray-500 mt-2 text-center">※ 全スレッドの記憶は保持されます</p>
                </div>

                <!-- Appearance -->
                <div class="border-b border-gray-700 pb-4">
                    <h3 class="text-sm font-semibold text-gray-400 uppercase mb-3">外観設定</h3>
                    
                    <!-- Color -->
                    <div class="mb-3">
                        <label class="block text-sm text-gray-300 mb-1">顔の色</label>
                        <div class="flex gap-2">
                            <label class="cursor-pointer"><input type="radio" name="color" value="mint" class="sr-only peer" checked><div class="w-8 h-8 rounded-full bg-[#98FF98] ring-2 ring-transparent peer-checked:ring-white transition"></div></label>
                            <label class="cursor-pointer"><input type="radio" name="color" value="pink" class="sr-only peer"><div class="w-8 h-8 rounded-full bg-[#FFB6C1] ring-2 ring-transparent peer-checked:ring-white transition"></div></label>
                            <label class="cursor-pointer"><input type="radio" name="color" value="blue" class="sr-only peer"><div class="w-8 h-8 rounded-full bg-[#ADD8E6] ring-2 ring-transparent peer-checked:ring-white transition"></div></label>
                            <label class="cursor-pointer"><input type="radio" name="color" value="yellow" class="sr-only peer"><div class="w-8 h-8 rounded-full bg-[#FFFFE0] ring-2 ring-transparent peer-checked:ring-white transition"></div></label>
                        </div>
                    </div>

                    <!-- Size -->
                    <div class="mb-3">
                        <label class="block text-sm text-gray-300 mb-1">大きさ</label>
                        <select id="size-select" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-white focus:ring-1 focus:ring-blue-500 outline-none">
                            <option value="small">小 (Small)</option>
                            <option value="medium" selected>中 (Medium)</option>
                            <option value="large">大 (Large)</option>
                        </select>
                    </div>

                    <!-- Eyes -->
                    <div class="mb-3">
                        <label class="block text-sm text-gray-300 mb-1">目の形</label>
                        <select id="eyes-select" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-white focus:ring-1 focus:ring-blue-500 outline-none">
                            <option value="circle" selected>丸</option>
                            <option value="square">四角</option>
                            <option value="cross">バツ</option>
                        </select>
                    </div>

                    <!-- Mouth -->
                    <div>
                        <label class="block text-sm text-gray-300 mb-1">口の形</label>
                        <select id="mouth-select" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-white focus:ring-1 focus:ring-blue-500 outline-none">
                            <option value="circle" selected>丸</option>
                            <option value="rect">細長い四角</option>
                            <option value="cross">バツ</option>
                            <option value="line">直線</option>
                        </select>
                    </div>
                </div>

                <!-- AI Persona -->
                <div>
                    <h3 class="text-sm font-semibold text-gray-400 uppercase mb-3">AI 設定</h3>
                    <label class="block text-sm text-gray-300 mb-1">話し方 (方言)</label>
                    <select id="dialect-select" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-2 text-white focus:ring-1 focus:ring-blue-500 outline-none">
                        <option value="standard" selected>標準語 (フランクな女性)</option>
                        <option value="kansai">関西弁 (フランクな女性)</option>
                        <option value="kyushu">九州弁 (フランクな女性)</option>
                    </select>

                    <div class="mt-4 flex items-center justify-between">
                        <label class="text-sm text-gray-300">音声読み上げ</label>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="voice-toggle" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Error/Notification Toast -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-4 py-2 rounded-lg shadow-lg opacity-0 transition-opacity duration-300 z-50 pointer-events-none">
        Error Message
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, addDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'face-chatbot';
        const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        let firebaseConfig = {};
        try {
            firebaseConfig = JSON.parse(firebaseConfigStr);
        } catch (e) {
            console.warn("Invalid Firebase config provided");
        }

        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // Settings State
        const settings = {
            color: 'mint',
            size: 'medium', // small, medium, large
            eyes: 'circle', // circle, square, cross
            mouth: 'circle', // circle, rect, cross, line
            dialect: 'standard', // standard, kansai, kyushu
            voiceOutput: true
        };

        // Application State
        let currentUserId = null;
        let currentThreadId = `thread_${Date.now()}`;
        let allMessages = [];
        let db, auth;
        let isWaitingForResponse = false;
        
        // DOM Elements
        const avatarContainer = document.getElementById('avatar-container');
        const chatHistoryEl = document.getElementById('chat-history');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const aiStatus = document.getElementById('ai-status');
        const toastEl = document.getElementById('toast');

        const colors = {
            mint: '#98FF98',
            pink: '#FFB6C1',
            blue: '#ADD8E6',
            yellow: '#FFFFE0'
        };

        const sizes = {
            small: 'w-24 h-24 md:w-32 md:h-32',
            medium: 'w-32 h-32 md:w-48 md:h-48',
            large: 'w-48 h-48 md:w-64 md:h-64'
        };

        function renderAvatar() {
            const bgColor = colors[settings.color] || colors.mint;
            
            // Eye shapes
            let eyesSvg = '';
            if (settings.eyes === 'circle') {
                eyesSvg = `<circle cx="30" cy="40" r="6" fill="#333"/><circle cx="70" cy="40" r="6" fill="#333"/>`;
            } else if (settings.eyes === 'square') {
                eyesSvg = `<rect x="24" y="34" width="12" height="12" fill="#333" rx="2"/><rect x="64" y="34" width="12" height="12" fill="#333" rx="2"/>`;
            } else if (settings.eyes === 'cross') {
                eyesSvg = `<g stroke="#333" stroke-width="4" stroke-linecap="round">
                    <line x1="24" y1="34" x2="36" y2="46"/><line x1="36" y1="34" x2="24" y2="46"/>
                    <line x1="64" y1="34" x2="76" y2="46"/><line x1="76" y1="34" x2="64" y2="46"/>
                </g>`;
            }

            // Mouth shapes
            let mouthSvg = '';
            if (settings.mouth === 'circle') {
                mouthSvg = `<circle cx="50" cy="65" r="8" fill="#333"/>`;
            } else if (settings.mouth === 'rect') {
                mouthSvg = `<rect x="35" y="60" width="30" height="10" fill="#333" rx="3"/>`;
            } else if (settings.mouth === 'cross') {
                mouthSvg = `<g stroke="#333" stroke-width="4" stroke-linecap="round">
                    <line x1="42" y1="57" x2="58" y2="73"/><line x1="58" y1="57" x2="42" y2="73"/>
                </g>`;
            } else if (settings.mouth === 'line') {
                mouthSvg = `<line x1="38" y1="65" x2="62" y2="65" stroke="#333" stroke-width="5" stroke-linecap="round"/>`;
            }

            const sizeClasses = sizes[settings.size] || sizes.medium;
            
            // Re-apply classes cleanly
            avatarContainer.className = `avatar-svg transition-all duration-300 flex items-center justify-center ${sizeClasses}`;

            avatarContainer.innerHTML = `
                <svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-2xl filter" preserveAspectRatio="xMidYMid meet">
                    <!-- Face base -->
                    <circle cx="50" cy="50" r="48" fill="${bgColor}" />
                    <!-- Eyes Group -->
                    <g class="eyes">
                        ${eyesSvg}
                    </g>
                    <!-- Mouth Group -->
                    <g class="mouth">
                        ${mouthSvg}
                    </g>
                </svg>
            `;
        }

        // Initialize avatar
        renderAvatar();

        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.remove('opacity-0');
            setTimeout(() => toastEl.classList.add('opacity-0'), 3000);
        }

        function setAvatarState(state) {
            avatarContainer.classList.remove('thinking', 'speaking');
            if (state) avatarContainer.classList.add(state);
            
            if (state === 'thinking') aiStatus.textContent = '考え中...';
            else if (state === 'speaking') aiStatus.textContent = '話しています...';
            else aiStatus.textContent = '';
        }

        async function initFirebase() {
            if (Object.keys(firebaseConfig).length === 0) {
                console.warn("Firebase not configured. Using local mode only.");
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                if (initialToken) {
                    await signInWithCustomToken(auth, initialToken);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        currentUserId = user.uid;
                        loadChatHistory();
                    }
                });
            } catch (error) {
                console.error("Firebase init error:", error);
                showToast("データベースへの接続に失敗しました");
            }
        }

        function loadChatHistory() {
            if (!currentUserId || !db) return;

            const messagesRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'messages');
            
            // RULE 2: No complex queries. Fetch all and filter/sort in memory.
            onSnapshot(messagesRef, (snapshot) => {
                let fetchedMessages = [];
                snapshot.forEach(doc => {
                    fetchedMessages.push({ id: doc.id, ...doc.data() });
                });
                
                // Sort by timestamp
                fetchedMessages.sort((a, b) => a.timestamp - b.timestamp);
                allMessages = fetchedMessages;
                
                renderChatHistory();
            }, (error) => {
                console.error("Error fetching messages:", error);
            });
        }

        function renderChatHistory() {
            chatHistoryEl.innerHTML = '';
            
            const threadMessages = allMessages.filter(m => m.threadId === currentThreadId);
            
            if (threadMessages.length === 0) {
                chatHistoryEl.innerHTML = `
                    <div class="text-center text-gray-500 text-sm italic mt-10">
                        新しい会話を始めましょう (スレッド: ${currentThreadId.slice(-4)})
                    </div>`;
                return;
            }

            threadMessages.forEach(msg => {
                const bubble = document.createElement('div');
                bubble.className = `max-w-[80%] rounded-2xl px-4 py-2 ${msg.role === 'user' ? 'bg-blue-600 text-white ml-auto rounded-br-none' : 'bg-gray-700 text-gray-200 mr-auto rounded-bl-none'}`;
                
                // Convert newlines to br tags safely
                const textDiv = document.createElement('div');
                textDiv.textContent = msg.text;
                bubble.innerHTML = textDiv.innerHTML.replace(/\n/g, '<br>');
                
                const wrapper = document.createElement('div');
                wrapper.className = 'flex w-full mt-3';
                wrapper.appendChild(bubble);
                
                chatHistoryEl.appendChild(wrapper);
            });

            // Scroll to bottom
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
        }

        async function saveMessage(role, text) {
            const message = {
                threadId: currentThreadId,
                role: role,
                text: text,
                timestamp: Date.now()
            };

            // Optimistic UI update
            allMessages.push(message);
            renderChatHistory();

            if (currentUserId && db) {
                try {
                    const messagesRef = collection(db, 'artifacts', appId, 'users', currentUserId, 'messages');
                    await addDoc(messagesRef, message);
                } catch (e) {
                    console.error("Error saving message:", e);
                }
            }
        }

        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text || isWaitingForResponse) return;

            chatInput.value = '';
            autoResizeTextarea();
            
            await saveMessage('user', text);
            generateAIResponse();
        }

        async function generateAIResponse() {
            isWaitingForResponse = true;
            sendBtn.disabled = true;
            setAvatarState('thinking');
            
            // Build Context
            // 1. Global context from all other threads (limit to last 20 messages for prompt size)
            const otherThreads = allMessages.filter(m => m.threadId !== currentThreadId).slice(-20);
            let globalMemoryStr = otherThreads.map(m => `${m.role === 'user' ? 'User' : 'AI'}: ${m.text}`).join('\n');
            if (globalMemoryStr.length > 1000) globalMemoryStr = globalMemoryStr.substring(globalMemoryStr.length - 1000); // cap size

            // 2. Current thread context
            const currentThread = allMessages.filter(m => m.threadId === currentThreadId);
            const geminiHistory = currentThread.map(m => ({
                role: m.role === 'user' ? 'user' : 'model',
                parts: [{ text: m.text }]
            }));

            // 3. System Prompt
            let systemPromptText = `あなたは親しみやすいAIアシスタントです。`;
            if (settings.dialect === 'kansai') {
                systemPromptText += `関西弁を話す親しみやすい女性として振る舞ってください。ため口で会話してください。一人称は「うち」などが自然です。`;
            } else if (settings.dialect === 'kyushu') {
                systemPromptText += `九州弁（博多弁など）を話す親しみやすい女性として振る舞ってください。ため口で会話してください。語尾に「〜と」「〜けん」などを自然に使ってください。`;
            } else {
                systemPromptText += `フランクな女性の言葉遣いの標準語で話してください。親しみやすく、ため口で会話してください。`;
            }

            systemPromptText += `\n\n【過去の全スレッドでの会話記憶（参考）】\n${globalMemoryStr || '特になし'}\n\nこの記憶も踏まえて、直近のユーザーの会話に自然に応答してください。文字数は長すぎないように（150字以内目安）してください。`;

            const payload = {
                contents: geminiHistory,
                systemInstruction: { parts: [{ text: systemPromptText }] },
            };

            try {
                // Using empty apiKey relies on the environment to inject it
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.candidates && result.candidates[0] && result.candidates[0].content) {
                    const aiText = result.candidates[0].content.parts[0].text;
                    await saveMessage('model', aiText);
                    
                    if (settings.voiceOutput) {
                        speakText(aiText);
                    } else {
                        setAvatarState(null);
                    }
                } else {
                    throw new Error("Invalid response format");
                }
            } catch (error) {
                console.error("Gemini API Error:", error);
                showToast("応答の生成に失敗しました。時間をおいて再試行してください。");
                setAvatarState(null);
            } finally {
                isWaitingForResponse = false;
                sendBtn.disabled = false;
            }
        }

        // Speech Synthesis
        const synth = window.speechSynthesis;
        let currentUtterance = null;

        function speakText(text) {
            if (!synth) {
                setAvatarState(null);
                return;
            }
            if (synth.speaking) {
                synth.cancel();
            }

            // Remove markdown/emojis for cleaner speech
            const cleanText = text.replace(/[*_#`]/g, '').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');

            currentUtterance = new SpeechSynthesisUtterance(cleanText);
            currentUtterance.lang = 'ja-JP';
            currentUtterance.rate = 1.1; // Slightly faster for natural feel
            
            // Try to find a female Japanese voice
            const voices = synth.getVoices();
            const jpVoices = voices.filter(v => v.lang === 'ja-JP');
            if (jpVoices.length > 0) {
                // Heuristic for female voice if available, otherwise just use first
                const femaleVoice = jpVoices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('kyoko'));
                currentUtterance.voice = femaleVoice || jpVoices[0];
            }

            currentUtterance.onstart = () => {
                setAvatarState('speaking');
            };
            currentUtterance.onend = () => {
                setAvatarState(null);
            };
            currentUtterance.onerror = () => {
                setAvatarState(null);
            };

            synth.speak(currentUtterance);
        }

        // Make sure voices are loaded
        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = () => synth.getVoices();
        }

        // Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('text-red-500', 'bg-red-500/20');
                micBtn.classList.remove('text-gray-400');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                
                // Display interim text
                if (finalTranscript) {
                    chatInput.value += finalTranscript;
                    autoResizeTextarea();
                    handleSend(); // Auto send on final voice input
                }
            };

            recognition.onspeechend = () => {
                recognition.stop();
            };

            recognition.onend = () => {
                isRecording = false;
                micBtn.classList.remove('text-red-500', 'bg-red-500/20');
                micBtn.classList.add('text-gray-400');
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                isRecording = false;
                micBtn.classList.remove('text-red-500', 'bg-red-500/20');
                micBtn.classList.add('text-gray-400');
            };
        } else {
            micBtn.style.display = 'none'; // Hide mic if not supported
        }

        
        // Auto-resize textarea
        function autoResizeTextarea() {
            chatInput.style.height = 'auto';
            chatInput.style.height = (chatInput.scrollHeight) + 'px';
        }
        chatInput.addEventListener('input', autoResizeTextarea);

        // Double Enter Logic
        let consecutiveEnters = 0;
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (!e.shiftKey) {
                    consecutiveEnters++;
                    if (consecutiveEnters >= 2) {
                        e.preventDefault();
                        handleSend();
                        consecutiveEnters = 0;
                    }
                }
            } else {
                consecutiveEnters = 0;
            }
        });

        sendBtn.addEventListener('click', handleSend);
        
        micBtn.addEventListener('click', () => {
            if (isRecording) {
                recognition.stop();
            } else if (recognition) {
                try {
                    recognition.start();
                } catch(e) {
                    // Ignore if already started
                }
            }
        });

        // Settings Modal Logic
        const settingsModal = document.getElementById('settings-modal');
        const settingsBtn = document.getElementById('settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const modalContent = settingsModal.querySelector('div');

        function openSettings() {
            settingsModal.classList.remove('hidden');
            // Trigger reflow
            void settingsModal.offsetWidth;
            settingsModal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
        }

        function closeSettings() {
            settingsModal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                settingsModal.classList.add('hidden');
            }, 300);
        }

        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        // Setup Bindings
        document.querySelectorAll('input[name="color"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                settings.color = e.target.value;
                renderAvatar();
            });
        });

        document.getElementById('size-select').addEventListener('change', (e) => {
            settings.size = e.target.value;
            renderAvatar();
        });

        document.getElementById('eyes-select').addEventListener('change', (e) => {
            settings.eyes = e.target.value;
            renderAvatar();
        });

        document.getElementById('mouth-select').addEventListener('change', (e) => {
            settings.mouth = e.target.value;
            renderAvatar();
        });

        document.getElementById('dialect-select').addEventListener('change', (e) => {
            settings.dialect = e.target.value;
        });

        document.getElementById('voice-toggle').addEventListener('change', (e) => {
            settings.voiceOutput = e.target.checked;
            if (!settings.voiceOutput && synth.speaking) {
                synth.cancel();
            }
        });

        document.getElementById('new-thread-btn').addEventListener('click', () => {
            currentThreadId = `thread_${Date.now()}`;
            renderChatHistory();
            closeSettings();
            showToast("新しいスレッドを作成しました。過去の記憶は引き継がれます。");
            document.getElementById('current-thread-name').textContent = `スレッド #${currentThreadId.slice(-4)}`;
        });

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            document.getElementById('current-thread-name').textContent = `スレッド #${currentThreadId.slice(-4)}`;
        });

    </script>
</body>
</html>
